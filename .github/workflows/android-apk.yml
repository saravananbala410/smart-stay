name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "smart-stay-updated/frontend/**"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-stay-updated/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: smart-stay-apk
          path: smart-stay-updated/frontend/android/app/build/outputs/apk/debug/app-debug.apk
